<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lançamento de fechamento · Monitor Adyen</title>
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#181d24; --line:#232a33;
    --text:#e7ecf1; --muted:#7d8896;
    --ok:#3ddc97; --ok-dim:#1c3a2e;
    --warn:#f2b33d; --warn-dim:#3a2e14;
    --bad:#ff5c5c; --bad-dim:#3a1616;
    --accent:#5cc8ff;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:20px 16px 60px;max-width:640px;margin-inline:auto;}
  h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0;}
  h2{font-size:14px;font-weight:700;margin:0 0 12px;}
  .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  a.back,button.back{font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:16px;border:1px solid var(--line);background:none;cursor:pointer;}
  a.back:hover,button.back:hover{color:var(--text);border-color:var(--accent);}
  .hidden{display:none!important;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin:12px 0 4px;font-family:var(--mono);}
  label:first-child{margin-top:0;}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--sans);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:60px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .grid2 label{grid-column:span 2;}
  @media(min-width:420px){ .grid2 label.half{grid-column:span 1;} }
  .btn-primary{width:100%;margin-top:18px;background:var(--accent);color:#06202b;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:10px;font-size:12.5px;padding:10px 12px;border-radius:8px;}
  .msg.ok{background:var(--ok-dim);color:var(--ok);}
  .msg.err{background:var(--bad-dim);color:var(--bad);}
  .card{border-top:1px solid var(--line);padding:12px 0;}
  .card:first-child{border-top:none;padding-top:0;}
  .card .linha1{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;}
  .card .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
  .card .valores{display:flex;gap:14px;margin-top:8px;font-size:12.5px;flex-wrap:wrap;}
  .card .valores b{color:var(--text);}
  .badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:20px;display:inline-block;}
  .badge.PENDENTE{background:var(--warn-dim);color:var(--warn);}
  .badge.APROVADO{background:var(--ok-dim);color:var(--ok);}
  .badge.REJEITADO{background:var(--bad-dim);color:var(--bad);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0;font-family:var(--sans);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.hidden{display:none!important;}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:18px 16px 24px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}
  .sheet h3{margin:0 0 4px;font-size:15px;}
  .sheet .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Solutions Ti Tech · Adyen</div>
    <h1>Lançamento de fechamento</h1>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <a class="back hidden" id="nav-monitor" href="/">📈 Monitor</a>
    <button class="back" onclick="logout()">🚪 Sair</button>
  </div>
</header>

<div id="sem-acesso" class="empty hidden">Você não tem acesso ao lançamento de fechamento. Fale com o administrador (Master).</div>

<div id="root" class="hidden">

<div class="panel">
  <h2>Novo fechamento</h2>
  <form id="form-lancar">
    <label>Unidade</label>
    <select id="f-unidade" required></select>

    <label>Data do fechamento</label>
    <input type="date" id="f-data" required>

    <label>Gerente responsável</label>
    <input type="text" id="f-gerente" placeholder="nome de quem fechou o caixa">

    <div class="grid2">
      <label class="half">Caixa inicial (R$)</label>
      <label class="half">Caixa final (R$)</label>
      <input class="half" type="number" step="0.01" id="f-caixaInicial">
      <input class="half" type="number" step="0.01" id="f-caixaFinal">

      <label class="half">Delivery</label>
      <label class="half">Carryout</label>
      <input class="half" type="number" step="0.01" id="f-delivery">
      <input class="half" type="number" step="0.01" id="f-carryout">

      <label class="half">Pickup</label>
      <label class="half">Loja (salão)</label>
      <input class="half" type="number" step="0.01" id="f-pickup">
      <input class="half" type="number" step="0.01" id="f-loja">

      <label class="half">Adyen (maquininha)</label>
      <label class="half">iFood</label>
      <input class="half" type="number" step="0.01" id="f-adyen">
      <input class="half" type="number" step="0.01" id="f-ifood">

      <label class="half">99Food</label>
      <label class="half">Pix</label>
      <input class="half" type="number" step="0.01" id="f-food99">
      <input class="half" type="number" step="0.01" id="f-pix">

      <label class="half">Pix CNPJ</label>
      <label class="half">Outros</label>
      <input class="half" type="number" step="0.01" id="f-pixCnpj">
      <input class="half" type="number" step="0.01" id="f-outros">

      <label class="half">Total de saída</label>
      <label class="half">Faturamento total</label>
      <input class="half" type="number" step="0.01" id="f-totalSaida">
      <input class="half" type="number" step="0.01" id="f-faturamento">

      <label class="half">Total declarado</label>
      <label class="half">Quebra de caixa</label>
      <input class="half" type="number" step="0.01" id="f-totalDeclarado">
      <input class="half" type="number" step="0.01" id="f-quebra">

      <label class="half">TC (tíquete médio)</label>
      <label class="half">Cancelados</label>
      <input class="half" type="number" step="0.01" id="f-tc">
      <input class="half" type="number" step="0.01" id="f-cancelados">
    </div>

    <label>Observação (opcional)</label>
    <textarea id="f-observacao" placeholder="qualquer detalhe do fechamento do dia"></textarea>

    <div class="msg hidden" id="msg"></div>
    <button class="btn-primary" type="submit" id="btn-enviar">Lançar fechamento</button>
  </form>
</div>

<div class="panel">
  <h2>Meus últimos lançamentos</h2>
  <div id="lista-lancamentos"><div class="empty">carregando...</div></div>
</div>

</div>

<div class="overlay hidden" id="overlay-edicao">
  <div class="sheet">
    <h3>Pedir correção</h3>
    <div class="sub" id="edicao-info"></div>
    <form id="form-edicao">
      <label>Qual valor está errado e qual o valor correto?</label>
      <select id="e-campo"></select>
      <input type="number" step="0.01" id="e-valor" placeholder="valor correto" style="margin-top:8px;">
      <label>Motivo da correção</label>
      <textarea id="e-motivo" placeholder="explique o que aconteceu, o Master vai revisar antes de aprovar" required></textarea>
      <div class="msg hidden" id="msg-edicao"></div>
      <button class="btn-primary" type="submit">Enviar pedido ao Master</button>
    </form>
    <button class="link-btn" style="margin-top:12px;" onclick="fecharEdicao()">Cancelar</button>
  </div>
</div>

<script>
let AUTH_TOKEN = localStorage.getItem('authToken') || null;
if(!AUTH_TOKEN){ location.href = '/'; }

const _rawFetch = window.fetch.bind(window);
window.fetch = (url, opts = {}) => {
  if (typeof url === 'string' && url.startsWith('/api/') && AUTH_TOKEN) {
    opts = { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + AUTH_TOKEN } };
  }
  return _rawFetch(url, opts).then((res) => { if (res.status === 401) logout(); return res; });
};
function logout(){ localStorage.removeItem('authToken'); location.href = '/'; }

const UNIDADES_NOMES = { '19821':'São Miguel', '19855':'Carrão', '19888':'Mooca', '19889':'Tatuapé' };
const CAMPOS_NUMERICOS = ['caixaInicial','caixaFinal','delivery','carryout','pickup','loja','adyen','ifood','food99','pix','pixCnpj','outros','totalSaida','faturamento','totalDeclarado','quebra','tc','cancelados'];
const NOMES_CAMPOS = { caixaInicial:'Caixa inicial', caixaFinal:'Caixa final', delivery:'Delivery', carryout:'Carryout', pickup:'Pickup', loja:'Loja (salão)', adyen:'Adyen', ifood:'iFood', food99:'99Food', pix:'Pix', pixCnpj:'Pix CNPJ', outros:'Outros', totalSaida:'Total de saída', faturamento:'Faturamento total', totalDeclarado:'Total declarado', quebra:'Quebra de caixa', tc:'TC', cancelados:'Cancelados' };

let ME = null;
let MEUS = [];
let EDICOES = [];
let EDITANDO_ID = null;

function fmtMoney(v){ return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; }

async function carregar(){
  const [meus, edicoes] = await Promise.all([
    fetch('/api/fechamentos/meus').then(r=>r.json()),
    fetch('/api/fechamentos/edicoes').then(r=>r.json()),
  ]);
  MEUS = meus.sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,20);
  EDICOES = edicoes;
  renderLista();
}

function edicaoPendente(fechamentoId){
  return EDICOES.find(e=>e.fechamentoId===fechamentoId && e.status==='PENDENTE');
}
function ultimaDecisao(fechamentoId){
  return EDICOES.filter(e=>e.fechamentoId===fechamentoId && e.status!=='PENDENTE').sort((a,b)=>(b.decididoEm||'').localeCompare(a.decididoEm||''))[0];
}

function renderLista(){
  const el = document.getElementById('lista-lancamentos');
  if(!MEUS.length){ el.innerHTML = '<div class="empty">Nenhum fechamento lançado ainda.</div>'; return; }
  el.innerHTML = MEUS.map(f=>{
    const pendente = edicaoPendente(f.id);
    const decidida = !pendente && ultimaDecisao(f.id);
    return `
    <div class="card">
      <div class="linha1">
        <span>${escapeHtml(f.unidadeNome||f.unidade)} · ${fmtData(f.data)}</span>
        ${pendente?'<span class="badge PENDENTE">correção pendente</span>':''}
        ${decidida?`<span class="badge ${decidida.status}">${decidida.status==='APROVADO'?'correção aprovada':'correção rejeitada'}</span>`:''}
      </div>
      <div class="sub">lançado em ${new Date(f.criadoEm).toLocaleString('pt-BR')}${f.gerente?(' · '+escapeHtml(f.gerente)):''}</div>
      <div class="valores">
        <span>Faturamento <b>${fmtMoney(f.faturamento)}</b></span>
        <span>Declarado <b>${fmtMoney(f.totalDeclarado)}</b></span>
        <span>Diferença <b style="color:${Math.abs(f.diferenca)<0.01?'var(--ok)':'var(--bad)'}">${fmtMoney(f.diferenca)}</b></span>
      </div>
      ${pendente?'':'<button class="link-btn" style="margin-top:8px;" onclick="abrirEdicao(\''+f.id+'\')">Pedir correção</button>'}
    </div>`;
  }).join('');
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function abrirEdicao(id){
  EDITANDO_ID = id;
  const f = MEUS.find(x=>x.id===id);
  document.getElementById('edicao-info').textContent = `${f.unidadeNome||f.unidade} · ${fmtData(f.data)} — depois de lançado o fechamento não pode ser mudado direto; o pedido vai para aprovação do Master.`;
  document.getElementById('e-campo').innerHTML = CAMPOS_NUMERICOS.map(c=>`<option value="${c}">${NOMES_CAMPOS[c]} (atual: ${fmtMoney(f[c])})</option>`).join('');
  document.getElementById('e-valor').value = '';
  document.getElementById('e-motivo').value = '';
  document.getElementById('msg-edicao').classList.add('hidden');
  document.getElementById('overlay-edicao').classList.remove('hidden');
}
function fecharEdicao(){ document.getElementById('overlay-edicao').classList.add('hidden'); EDITANDO_ID=null; }

document.getElementById('form-edicao').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const campo = document.getElementById('e-campo').value;
  const valor = document.getElementById('e-valor').value;
  const motivo = document.getElementById('e-motivo').value;
  const msg = document.getElementById('msg-edicao');
  msg.classList.add('hidden');
  try{
    const res = await fetch(`/api/fechamentos/${EDITANDO_ID}/solicitar-edicao`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mudancas: { [campo]: valor }, motivo }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'erro ao enviar pedido');
    fecharEdicao();
    await carregar();
  }catch(err){
    msg.textContent = err.message; msg.className = 'msg err';
  }
});

document.getElementById('form-lancar').addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  const btn = document.getElementById('btn-enviar');
  const msg = document.getElementById('msg');
  msg.classList.add('hidden');
  btn.disabled = true;
  try{
    const unidade = document.getElementById('f-unidade').value;
    const campos = {};
    CAMPOS_NUMERICOS.forEach(c=>{ campos[c] = document.getElementById('f-'+c).value; });
    const body = {
      unidade,
      unidadeNome: UNIDADES_NOMES[unidade] || unidade,
      grupo: ME.permissions?.unidades?.length ? 'MANUAL' : 'MANUAL',
      data: document.getElementById('f-data').value,
      gerente: document.getElementById('f-gerente').value,
      campos,
      observacao: document.getElementById('f-observacao').value,
    };
    const res = await fetch('/api/fechamentos/lancar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'erro ao lançar');
    msg.textContent = 'Fechamento lançado com sucesso.'; msg.className = 'msg ok';
    document.getElementById('form-lancar').reset();
    document.getElementById('f-data').value = new Date().toISOString().slice(0,10);
    await carregar();
  }catch(err){
    msg.textContent = err.message; msg.className = 'msg err';
  }finally{
    btn.disabled = false;
  }
});

async function boot(){
  const res = await fetch('/api/me');
  if(!res.ok){ logout(); return; }
  ME = await res.json();
  const isMaster = ME.role==='master';
  const secoes = isMaster ? ['monitor','disputas','cofre','fechamentos','lancamento'] : (ME.permissions?.sections||[]);
  document.getElementById('nav-monitor').classList.toggle('hidden', !secoes.includes('monitor'));

  if(!secoes.includes('lancamento')){
    document.getElementById('sem-acesso').classList.remove('hidden');
    return;
  }

  const unidades = isMaster ? Object.keys(UNIDADES_NOMES) : (ME.permissions?.unidades||[]);
  const selUnidade = document.getElementById('f-unidade');
  selUnidade.innerHTML = unidades.length
    ? unidades.map(u=>`<option value="${u}">${escapeHtml(UNIDADES_NOMES[u]||u)}</option>`).join('')
    : '<option value="" disabled selected>nenhuma unidade liberada</option>';
  document.getElementById('f-data').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-data').max = new Date().toISOString().slice(0,10);

  document.getElementById('root').classList.remove('hidden');
  await carregar();
}

boot();
</script>
</body>
</html>
