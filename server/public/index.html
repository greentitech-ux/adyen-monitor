<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith Ops</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#12161b; --panel2:#181d24; --line:#232a33;
    --text:#e7ecf1; --muted:#7d8896;
    --bad:#ff5c5c;
    --accent:#5cc8ff;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .hidden{display:none!important;}
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:360px;}
  .auth-logo{display:block;width:72px;height:72px;margin:0 auto 14px;border-radius:50%;}
  .auth-card h1{font-size:16px;margin:0 0 4px;}
  .auth-card label{display:block;margin-top:14px;font-size:12px;color:var(--muted);}
  .auth-card input{width:100%;margin-top:5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:var(--sans);font-size:13px;}
  .auth-card button{width:100%;margin-top:18px;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#06121a;font-weight:700;font-size:13px;cursor:pointer;}
  .auth-card button:disabled{opacity:.6;cursor:default;}
  .auth-error{color:var(--bad);font-size:12px;margin-top:10px;}
  .auth-suporte{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;}
  .auth-suporte a{color:var(--accent);text-decoration:none;font-weight:600;}
  .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .popup-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:340px;text-align:center;}
  .popup-card .popup-icone{font-size:30px;}
  .popup-card h2{font-size:14px;margin:10px 0 6px;}
  .popup-card p{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.5;}
  .popup-card .popup-suporte{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:10px;}
  .popup-card .popup-fechar{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>

<section id="auth-screen" class="auth-screen">
  <form id="auth-form" class="auth-card">
    <img src="/logo.png" alt="Zenith Ops" class="auth-logo">
    <h1 style="text-align:center;">Zenith Ops</h1>
    <p style="font-size:12px;margin:2px 0 0;text-align:center;color:var(--muted);">Entre com seu acesso</p>
    <label>Email
      <input type="email" id="auth-email" required autocomplete="email">
    </label>
    <label>Senha
      <input type="password" id="auth-password" required autocomplete="current-password">
    </label>
    <p id="auth-error" class="auth-error hidden"></p>
    <button type="submit" id="auth-btn">Entrar</button>
    <p class="auth-suporte">Dúvidas ou problemas pra entrar? Suporte: <a href="https://wa.me/5581995148654" target="_blank" rel="noopener">(81) 99514-8654</a></p>
  </form>
</section>

<div id="popup-suporte" class="popup-overlay hidden">
  <div class="popup-card">
    <div class="popup-icone">⚠️</div>
    <h2 id="popup-titulo">Não foi possível entrar</h2>
    <p id="popup-msg"></p>
    <a class="popup-suporte" href="https://wa.me/5581995148654" target="_blank" rel="noopener">💬 Falar com o suporte<br>(81) 99514-8654</a>
    <button type="button" class="popup-fechar" onclick="fecharPopupSuporte()">Fechar e tentar de novo</button>
  </div>
</div>

<script>
// "/" e so o portao de entrada da aplicacao: se ja tem sessao valida, manda
// direto pro Painel (pagina padrao de pouso, ver painel.html); sem sessao,
// mostra o login e manda pro Painel assim que autenticar. O Monitor de
// transacoes (antigo conteudo desta pagina) virou /monitor.html, acessivel
// pelo menu como qualquer outra secao - "/" nao mostra mais o dashboard
// direto, senao nunca daria pra "sempre iniciar no Painel"
let AUTH_TOKEN = localStorage.getItem('authToken') || null;

async function boot(){
  if(!AUTH_TOKEN) return;
  try{
    const res = await fetch('/api/me', { headers: { Authorization: 'Bearer '+AUTH_TOKEN } });
    if(!res.ok){ localStorage.removeItem('authToken'); return; }
    location.href = '/painel.html';
  }catch(e){ /* API fora do ar - deixa a pessoa tentar o login normalmente */ }
}

document.getElementById('auth-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const erroEl = document.getElementById('auth-error');
  const btn = document.getElementById('auth-btn');
  erroEl.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try{
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Não foi possível entrar.');
    localStorage.setItem('authToken', data.token);
    location.href = '/painel.html';
  }catch(err){
    erroEl.textContent = err.message;
    erroEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Entrar';
    abrirPopupSuporte(err.message);
  }
});

// qualquer erro no login (senha errada, conta bloqueada, fora do horário,
// acesso desativado, API fora do ar) abre o popup com o contato do suporte -
// a pessoa nunca fica travada na tela sem saber a quem recorrer
function abrirPopupSuporte(mensagem){
  document.getElementById('popup-msg').textContent = (mensagem || 'Algo deu errado.') + ' Se precisar de ajuda, chame o suporte:';
  document.getElementById('popup-suporte').classList.remove('hidden');
}
function fecharPopupSuporte(){
  document.getElementById('popup-suporte').classList.add('hidden');
  document.getElementById('auth-password').focus();
}
document.getElementById('popup-suporte').addEventListener('click', (e)=>{ if(e.target.id==='popup-suporte') fecharPopupSuporte(); });

boot();
</script>
</body>
</html>
